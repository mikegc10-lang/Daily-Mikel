<script type="text/babel" data-type="module">
import React, { useState, useEffect, useMemo } from "react";
import { createRoot } from "react-dom/client";
 
/* A tiny hand-rolled icon set — the only icons that truly need to be crisp
   vector glyphs (chevrons, plus, check, x, pencil, trash, calendar, trend
   arrows, minus). Everything else (habit symbols, category badges, star
   ratings) uses plain emoji, so the whole app has zero external icon or
   chart dependency and works fully offline once cached. */
function Icon({ name, size = 16, color, style }) {
  const common = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color || "currentColor", strokeWidth: 1.8, strokeLinecap: "round", strokeLinejoin: "round", style };
  switch (name) {
    case "chevron-up": return <svg {...common}><polyline points="18 15 12 9 6 15" /></svg>;
    case "chevron-down": return <svg {...common}><polyline points="6 9 12 15 18 9" /></svg>;
    case "chevron-left": return <svg {...common}><polyline points="15 18 9 12 15 6" /></svg>;
    case "chevron-right": return <svg {...common}><polyline points="9 18 15 12 9 6" /></svg>;
    case "plus": return <svg {...common}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>;
    case "check": return <svg {...common}><polyline points="20 6 9 17 4 12" /></svg>;
    case "x": return <svg {...common}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>;
    case "pencil": return <svg {...common}><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg>;
    case "trash": return <svg {...common}><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /><path d="M10 11v6" /><path d="M14 11v6" /><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" /></svg>;
    case "calendar": return <svg {...common}><rect x="3" y="4" width="18" height="18" rx="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></svg>;
    case "trending-up": return <svg {...common}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18" /><polyline points="17 6 23 6 23 12" /></svg>;
    case "trending-down": return <svg {...common}><polyline points="23 18 13.5 8.5 8.5 13.5 1 6" /><polyline points="17 18 23 18 23 12" /></svg>;
    case "minus": return <svg {...common}><line x1="5" y1="12" x2="19" y2="12" /></svg>;
    default: return null;
  }
}
 
/* ---------------------------------------------------------------------- */
/*  Constants                                                              */
/* ---------------------------------------------------------------------- */
 
const CATEGORY_DEFS = [
  { key: "numero", label: "Número", emoji: "🔢" },
  { key: "tiempo", label: "Tiempo", emoji: "⏱️" },
  { key: "escala", label: "Escala", emoji: "⭐" },
  { key: "valor", label: "Valor", emoji: "📏" },
  { key: "booleano", label: "Sí / No", emoji: "✅" },
];
const CAT_BY_KEY = Object.fromEntries(CATEGORY_DEFS.map((c) => [c.key, c]));
 
const FREQS = ["Diario", "Semanal", "Quincenal", "Mensual"];
const WEEKDAYS = ["L", "M", "X", "J", "V", "S", "D"];
const MONTHS = [
  "enero", "febrero", "marzo", "abril", "mayo", "junio",
  "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre",
];
 
/* ---------------------------------------------------------------------- */
/*  Date helpers (weeks start on Monday)                                  */
/* ---------------------------------------------------------------------- */
 
const pad2 = (n) => String(n).padStart(2, "0");
const dateKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const keyToDate = (k) => {
  const [y, m, d] = k.split("-").map(Number);
  return new Date(y, m - 1, d);
};
const todayKey = () => dateKey(new Date());
const mondayIndex = (d) => (d.getDay() + 6) % 7; // 0 = Monday
const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
const fmtDate = (k) => {
  const d = keyToDate(k);
  return `${d.getDate()} de ${MONTHS[d.getMonth()]}`;
};
const fmtDateShort = (k) => {
  const d = keyToDate(k);
  return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}`;
};
const timeToMinutes = (hhmm) => {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
};
 
function monthMatrix(year, month) {
  const first = new Date(year, month, 1);
  const offset = mondayIndex(first);
  const total = daysInMonth(year, month);
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(null);
  for (let day = 1; day <= total; day++) cells.push(new Date(year, month, day));
  while (cells.length % 7 !== 0) cells.push(null);
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  return weeks;
}
 
/* ---------------------------------------------------------------------- */
/*  Storage helpers — plain browser localStorage (works once deployed as   */
/*  a standalone site; kept async-shaped so the rest of the app is         */
/*  unchanged). A namespaced key prefix avoids clashing with other sites.  */
/* ---------------------------------------------------------------------- */
 
const STORAGE_PREFIX = "habitos_app:";
 
async function storageGet(key, fallback) {
  try {
    const raw = window.localStorage.getItem(STORAGE_PREFIX + key);
    return raw !== null ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
async function storageSet(key, value) {
  try {
    window.localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
  } catch (e) {
    /* ignore — keeps app usable even if persistence fails (e.g. private mode) */
  }
}
function storageClearAll() {
  try {
    ["habits", "entries", "rows"].forEach((k) => window.localStorage.removeItem(STORAGE_PREFIX + k));
  } catch (e) { /* ignore */ }
}
 
/* ---------------------------------------------------------------------- */
/*  Small building blocks                                                  */
/* ---------------------------------------------------------------------- */
 
/* Curated symbol library — common habits, plus the ones already discussed
   in this build (leer, dormir, correr, agua...). Stored per-habit as
   habit.icon so people can pick whichever best represents each one. */
const HABIT_ICONS = [
  { key: "book", label: "Leer", emoji: "📖" },
  { key: "moon", label: "Dormir", emoji: "🌙" },
  { key: "droplet", label: "Agua", emoji: "💧" },
  { key: "dumbbell", label: "Ejercicio", emoji: "🏋️" },
  { key: "footprints", label: "Caminar / Correr", emoji: "🏃" },
  { key: "bike", label: "Ciclismo", emoji: "🚴" },
  { key: "apple", label: "Alimentación", emoji: "🍎" },
  { key: "brain", label: "Meditación", emoji: "🧘" },
  { key: "music", label: "Música", emoji: "🎵" },
  { key: "pen", label: "Escritura", emoji: "✍️" },
  { key: "wallet", label: "Finanzas", emoji: "💰" },
  { key: "graduation", label: "Estudio", emoji: "🎓" },
  { key: "heart", label: "Salud", emoji: "❤️" },
  { key: "sun", label: "Rutina", emoji: "☀️" },
  { key: "coffee", label: "Café", emoji: "☕" },
  { key: "palette", label: "Arte", emoji: "🎨" },
  { key: "users", label: "Social", emoji: "👥" },
  { key: "target", label: "Metas", emoji: "🎯" },
  { key: "flame", label: "Constancia", emoji: "🔥" },
  { key: "smartphone", label: "Pantallas", emoji: "📱" },
];
const HABIT_ICONS_BY_KEY = Object.fromEntries(HABIT_ICONS.map((i) => [i.key, i]));
 
/* One symbol per habit: the person's chosen icon, falling back to the first
   category's icon for habits created before symbols existed. The protected
   "Dormir" habit gets the electric-blue treatment as its signature spot. */
function HabitIcon({ habit, size = 14 }) {
  const custom = HABIT_ICONS_BY_KEY[habit.icon];
  const fallbackDef = CAT_BY_KEY[habit.categories?.[0]?.type];
  const emoji = custom ? custom.emoji : (fallbackDef ? fallbackDef.emoji : "✨");
  const blue = !!habit.isDefault;
  return (
    <span
      title={habit.name}
      style={{
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        width: size + 12, height: size + 12, borderRadius: 999, flex: "0 0 auto",
        background: blue ? "var(--blue-soft)" : "var(--teal-soft)",
        fontSize: size, lineHeight: 1,
      }}
    >
      {emoji}
    </span>
  );
}
 
const ADDITIVE_TYPES = ["numero", "tiempo", "valor"];
 
/* Progress display: "5/10 páginas" — sums as the person keeps registering */
function formatValue(cat, val) {
  const v = val === "" || val === undefined || val === null ? 0 : val;
  if (cat.type === "booleano") return v ? "Sí" : "No";
  if (cat.type === "escala") return `${v || 0}/${cat.meta}★`;
  if (cat.type === "numero") return `${v || 0}/${cat.meta}`;
  if (cat.type === "tiempo" || cat.type === "valor") return `${v || 0}/${cat.meta}${cat.unit ? " " + cat.unit : ""}`;
  return `${v}`;
}
 
/* A single registro's own value, without the "/meta" comparison */
function formatRaw(cat, val) {
  const v = val === "" || val === undefined || val === null ? 0 : val;
  if (cat.type === "booleano") return v ? "Sí" : "No";
  if (cat.type === "escala") return `${v || 0}★`;
  if (cat.type === "tiempo" || cat.type === "valor") return `${v || 0}${cat.unit ? " " + cat.unit : ""}`;
  return `${v}`;
}
 
/* Today's total per category across every individual registro:
   additive categories (número/tiempo/valor) sum across all of the day's
   registros; escala/booleano use the most recent one (they don't accumulate). */
function computeAggregate(categories, records) {
  const agg = {};
  categories.forEach((c) => {
    if (ADDITIVE_TYPES.includes(c.type)) {
      agg[c.type] = records.reduce((sum, r) => sum + (parseFloat(r.values[c.type]) || 0), 0);
    } else {
      const withVal = records.filter((r) => r.values[c.type] !== undefined && r.values[c.type] !== "");
      agg[c.type] = withVal.length ? withVal[withVal.length - 1].values[c.type] : (c.type === "booleano" ? false : 0);
    }
  });
  return agg;
}
 
function meetsGoal(cat, val) {
  if (cat.type === "booleano") return val === cat.meta;
  const num = parseFloat(val);
  return !isNaN(num) && num >= parseFloat(cat.meta);
}
 
function metaSummary(c) {
  if (c.type === "booleano") return `Meta: ${c.meta ? "Sí" : "No"}`;
  if (c.type === "numero") return `Meta: ${c.meta}`;
  if (c.type === "tiempo" || c.type === "valor") return `Meta: ${c.meta}${c.unit ? " " + c.unit : ""}`;
  if (c.type === "escala") return `Meta: ${c.meta}★${c.label ? " (" + c.label + ")" : ""}`;
  return `Meta: ${c.meta}`;
}
 
/* Digital-crown style numeric wheel */
function CrownWheel({ values, value, onChange, labelFormatter, width = 64 }) {
  const idx = Math.max(0, values.indexOf(value));
  const step = (dir) => {
    const next = (idx + dir + values.length) % values.length;
    onChange(values[next]);
  };
  const prevVal = values[(idx - 1 + values.length) % values.length];
  const nextVal = values[(idx + 1) % values.length];
  return (
    <div
      style={{ width, userSelect: "none" }}
      onWheel={(e) => { e.preventDefault(); step(e.deltaY > 0 ? 1 : -1); }}
    >
      <button aria-label="siguiente" onClick={() => step(1)} style={crownBtnStyle}><Icon name="chevron-up" size={14} /></button>
      <div style={{ textAlign: "center", padding: "2px 0" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--ink-soft)", opacity: 0.5 }}>
          {labelFormatter(prevVal)}
        </div>
        <div style={{
          fontFamily: "var(--font-mono)", fontSize: 22, fontWeight: 600, color: "var(--ink)",
          padding: "2px 0", borderTop: "1px solid var(--line)", borderBottom: "1px solid var(--line)",
        }}>
          {labelFormatter(value)}
        </div>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--ink-soft)", opacity: 0.5 }}>
          {labelFormatter(nextVal)}
        </div>
      </div>
      <button aria-label="anterior" onClick={() => step(-1)} style={crownBtnStyle}><Icon name="chevron-down" size={14} /></button>
    </div>
  );
}
const crownBtnStyle = {
  width: "100%", background: "transparent", border: "none", cursor: "pointer",
  color: "var(--teal)", display: "flex", justifyContent: "center", padding: 2,
};
 
/* Single defined-time crown (hour + minute) — a fixed moment, not a range */
function TimeCrown({ hh, mm, onChange }) {
  const hours = Array.from({ length: 24 }, (_, i) => i);
  const mins = Array.from({ length: 12 }, (_, i) => i * 5);
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
      <CrownWheel values={hours} value={hh} onChange={(v) => onChange(v, mm)} labelFormatter={pad2} />
      <span style={{ fontSize: 20, color: "var(--ink-soft)", fontWeight: 600 }}>:</span>
      <CrownWheel values={mins} value={mm} onChange={(v) => onChange(hh, v)} labelFormatter={pad2} />
    </div>
  );
}
 
/* Big, centered call-to-action — the main action of Tab 1 (one size down) */
const bigAddBtn = {

/* Digital-crown style habit picker: rotate (scroll / arrows) to browse,
   then press "Seleccionar" to move on to editing that habit's registro. */

            {prevH.name}
          </div>
          <div
            style={{

              display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
            }}
          >
            <HabitIcon habit={current} size={15} /> {current.name}
          </div>
          <div style={{ fontSize: 12.5, color: "var(--ink-soft)", opacity: 0.5, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
            {nextH.name}
          </div>
        </div>
        <button onClick={() => step(1)} style={crownBtnStyle} aria-label="siguiente"><Icon name="chevron-down" size={15} /></button>
      </div>
      <button onClick={() => onSelect(current.id)} style={primaryBtnBig}><Icon name="check" size={15} /> Seleccionar</button>
      <button onClick={onNew} style={habitPillDashed}><Icon name="plus" size={13} /> Nuevo Hábito</button>
    </div>

}
 
/* Month calendar (Monday-first) used as a date picker popover */
function MiniCalendar({ selected, onSelect, onClose }) {
  const sel = keyToDate(selected);
  const [cursor, setCursor] = useState(new Date(sel.getFullYear(), sel.getMonth(), 1));
  const weeks = monthMatrix(cursor.getFullYear(), cursor.getMonth());
  const tKey = todayKey();
  return (
    <div style={{
      position: "absolute", zIndex: 40, top: "calc(100% + 6px)", left: 0,
      background: "var(--card)", border: "1px solid var(--line)", borderRadius: 12,
      padding: 12, boxShadow: "0 8px 24px rgba(35,40,31,0.14)", width: 258,
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
        <button style={iconBtnSm} onClick={() => setCursor(new Date(cursor.getFullYear(), cursor.getMonth() - 1, 1))}><Icon name="chevron-left" size={15} /></button>
        <span style={{ fontSize: 13, fontWeight: 600, textTransform: "capitalize", fontFamily: "var(--font-mono)" }}>
          {MONTHS[cursor.getMonth()]} {cursor.getFullYear()}
        </span>
        <button style={iconBtnSm} onClick={() => setCursor(new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1))}><Icon name="chevron-right" size={15} /></button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 2, marginBottom: 4 }}>
        {WEEKDAYS.map((w) => (
          <div key={w} style={{ textAlign: "center", fontSize: 10.5, color: "var(--ink-soft)", fontWeight: 600 }}>{w}</div>
        ))}
      </div>
      {weeks.map((week, wi) => (
        <div key={wi} style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 2 }}>
          {week.map((d, di) => {
            if (!d) return <div key={di} />;
            const k = dateKey(d);
            const isSel = k === selected;
            const isToday = k === tKey;
            return (
              <button
                key={di}
                onClick={() => { onSelect(k); onClose(); }}
                style={{
                  aspectRatio: "1", border: "none", borderRadius: 8, cursor: "pointer",
                  fontSize: 12.5, fontFamily: "var(--font-mono)",
                  background: isSel ? "var(--teal)" : "transparent",
                  color: isSel ? "#fff" : isToday ? "var(--amber-ink)" : "var(--ink)",
                  fontWeight: isSel || isToday ? 700 : 400,
                  outline: isToday && !isSel ? "1px solid var(--amber)" : "none",
                }}
              >{d.getDate()}</button>
            );
          })}
        </div>
      ))}
    </div>
  );
}
const iconBtnSm = { background: "transparent", border: "none", cursor: "pointer", color: "var(--ink-soft)", display: "flex" };
 
function Stars({ value, onChange, max = 10, disabled }) {
  return (
    <div style={{ display: "flex", gap: 1, flexWrap: "wrap" }}>
      {Array.from({ length: max }, (_, i) => i + 1).map((n) => (
        <button
          key={n}
          disabled={disabled}
          onClick={() => onChange(n)}
          style={{
            background: "none", border: "none", cursor: disabled ? "default" : "pointer", padding: 1,
            fontSize: 16, lineHeight: 1, color: n <= (value || 0) ? "var(--amber)" : "var(--line)",

          {n <= (value || 0) ? "★" : "☆"}

}
 
/* ---------------------------------------------------------------------- */
/*  Tab 1 — Registro diario                                                */
/* ---------------------------------------------------------------------- */
 
function TabRegistro({ habits, entries, commitEntry, editRecord, removeRecord, rows, goToCreate }) {
  return (
    <div style={{ padding: "0 4px" }}>
      <h1 style={titleStyle}>Hábito</h1>
 
      <ActivityAdder habits={habits} entries={entries} onCommit={commitEntry} goToCreate={goToCreate} />
 
      <RegistroTable habits={habits} entries={entries} rows={rows} editRecord={editRecord} removeRecord={removeRecord} />
    </div>
  );
}
 
/* Every individual registro as one row — like a spreadsheet: Hábito, Meta,
   Hora, Fecha, Suma (running total up to and including that row for
   additive categories), and a pencil to edit that specific row. Editing a
   row only changes that row; every later row's running total updates too,
   since it's recalculated from the full history each render. */
function RegistroTable({ habits, entries, rows, editRecord, removeRecord }) {
  const [editingKey, setEditingKey] = useState(null);
 
  const flat = [];
  rows.forEach((group) => {
    const habit = habits.find((h) => h.id === group.habitId);
    if (!habit) return;
    const records = entries[`${habit.id}__${group.date}`] || [];
    const running = {};
    habit.categories.forEach((c) => { if (ADDITIVE_TYPES.includes(c.type)) running[c.type] = 0; });
    records.forEach((r) => {
      habit.categories.forEach((c) => {
        if (ADDITIVE_TYPES.includes(c.type)) running[c.type] += parseFloat(r.values[c.type]) || 0;
      });
      flat.push({
        key: `${habit.id}__${group.date}__${r.id}`,
        habit, date: group.date, record: r,
        sumaSoFar: { ...running },
      });
    });
  });
 
  flat.sort((a, b) => {
    if (a.date !== b.date) return b.date.localeCompare(a.date);
    return b.record.savedAt.localeCompare(a.record.savedAt);
  });
 
  if (flat.length === 0) {
    return (
      <p style={{ color: "var(--ink-soft)", fontSize: 13.5, textAlign: "center", padding: "24px 0" }}>
        Toca "Agregar actividad" para registrar tu día.
      </p>
    );
  }
 
  return (
    <div style={{ marginTop: 8 }}>
      <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr 0.6fr 0.7fr 1.1fr 22px 22px", gap: 8, padding: "0 10px", marginBottom: 6 }}>
        {["Hábito", "Meta", "Hora", "Fecha", "Suma", "", ""].map((h, i) => (
          <div key={i} style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: 0.4, color: "var(--ink-soft)", fontWeight: 700 }}>{h}</div>
        ))}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {flat.map((item) => (
          editingKey === item.key ? (
            <div key={item.key} style={{ background: "var(--card)", border: "1px solid var(--teal)", borderRadius: 10, padding: 12 }}>
              <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 8, display: "flex", alignItems: "center", gap: 6 }}>
                <HabitIcon habit={item.habit} size={11} /> {item.habit.name} · {fmtDate(item.date)} · {item.record.savedAt}
              </div>
              <RegistroForm
                habit={item.habit}
                mode="edit"
                initialValues={item.record.values}
                onSave={(vals) => { editRecord(item.habit.id, item.date, item.record.id, vals); setEditingKey(null); }}
                onCancel={() => setEditingKey(null)}
              />
            </div>
          ) : (
            <div key={item.key} style={{
              display: "grid", gridTemplateColumns: "1.3fr 1fr 0.6fr 0.7fr 1.1fr 22px 22px", gap: 8, alignItems: "center",
              background: "var(--card)", border: "1px solid var(--line)", borderRadius: 10, padding: "9px 10px",
            }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, minWidth: 0 }}>
                <HabitIcon habit={item.habit} size={11} />
                <span style={{ fontSize: 12.5, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.habit.name}</span>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 1 }}>
                {item.habit.categories.map((c) => (
                  <span key={c.type} style={{ fontSize: 11, color: "var(--ink-soft)", fontFamily: "var(--font-mono)" }}>{metaLine(c)}</span>
                ))}
              </div>
              <div style={{ fontSize: 11.5, color: "var(--ink-soft)", fontFamily: "var(--font-mono)" }}>{item.record.savedAt}</div>
              <div style={{ fontSize: 11.5, color: "var(--ink-soft)", fontFamily: "var(--font-mono)" }}>{fmtDateShort(item.date)}</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 1 }}>
                {item.habit.categories.map((c) => {
                  const val = ADDITIVE_TYPES.includes(c.type) ? item.sumaSoFar[c.type] : item.record.values[c.type];
                  return (
                    <span key={c.type} style={{ fontSize: 12, fontWeight: 600, color: "var(--ink)", fontFamily: "var(--font-mono)" }}>
                      {formatValue(c, val)}
                    </span>
                  );
                })}
              </div>
              <button onClick={() => setEditingKey(item.key)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--ink-soft)" }} aria-label="editar registro">
                <Icon name="pencil" size={14} />
              </button>
              <button
                onClick={() => { if (window.confirm("¿Eliminar este registro?")) removeRecord(item.habit.id, item.date, item.record.id); }}
                style={{ background: "none", border: "none", cursor: "pointer", color: "var(--ink-soft)" }} aria-label="eliminar registro"
              >
                <Icon name="trash" size={14} />
              </button>
            </div>
          )
        ))}
      </div>
    </div>
  );
}
 
/* Header CTA: rotate the crown to browse habits, "Seleccionar" transitions
   into editing that habit's registro (fecha + valores) before it's saved. */
function ActivityAdder({ habits, entries, onCommit, goToCreate }) {
  const [open, setOpen] = useState(false);
  const [phase, setPhase] = useState("browse"); // 'browse' | 'edit'
  const [selectedId, setSelectedId] = useState(null);
  const [date, setDate] = useState(todayKey());
  const [calOpen, setCalOpen] = useState(false);
 
  const togglePanel = () => {
    setOpen((o) => {
      const next = !o;
      if (next) { setPhase("browse"); setDate(todayKey()); setCalOpen(false); }
      return next;
    });
  };
 
  const currentHabit = habits.find((h) => h.id === selectedId) || null;
  const existingRecords = currentHabit ? (entries[`${currentHabit.id}__${date}`] || []) : [];
  const aggregate = currentHabit ? computeAggregate(currentHabit.categories, existingRecords) : {};
 
  const handleSave = (values) => {
    onCommit(currentHabit.id, date, values);
    setOpen(false);
    setPhase("browse");
  };
 
  return (
    <>
      <div style={{ textAlign: "center", margin: "6px 0 16px" }}>
        <button onClick={togglePanel} style={bigAddBtn}>
          <Icon name="plus" size={20} /> Agregar actividad
        </button>
      </div>
 
      {open && phase === "browse" && (
        <div style={{ marginBottom: 22 }}>
          <HabitCrownPicker
            habits={habits}
            onSelect={(habitId) => { setSelectedId(habitId); setPhase("edit"); }}
            onNew={() => { setOpen(false); goToCreate(); }}
          />
        </div>
      )}
 
      {open && phase === "edit" && currentHabit && (
        <div style={{ background: "var(--card)", border: "1px solid var(--line)", borderRadius: 14, padding: "14px 16px", marginBottom: 22 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
              <HabitIcon habit={currentHabit} />
              <span style={{ fontWeight: 600, fontSize: 14.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{currentHabit.name}</span>
            </div>
            <button onClick={() => setPhase("browse")} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--ink-soft)", fontSize: 12, flex: "0 0 auto" }}>
              Cambiar hábito
            </button>
          </div>
 
          <div style={{ position: "relative", marginBottom: 14 }}>
            <div style={{ fontSize: 11, color: "var(--ink-soft)", marginBottom: 4, textTransform: "uppercase", letterSpacing: 0.4 }}>Fecha</div>
            <button onClick={() => setCalOpen((o) => !o)} style={{
              display: "flex", alignItems: "center", gap: 6, padding: "7px 10px", borderRadius: 8,
              border: "1px solid var(--line)", background: "var(--paper)", cursor: "pointer", fontSize: 12.5, color: "var(--ink)",
              fontFamily: "var(--font-mono)",
            }}>
              <Icon name="calendar" size={13} /> {fmtDate(date)}
            </button>
            {calOpen && <MiniCalendar selected={date} onSelect={setDate} onClose={() => setCalOpen(false)} />}
          </div>
 
          <RegistroForm habit={currentHabit} mode="add" aggregate={aggregate} onSave={handleSave} onCancel={() => setOpen(false)} />
        </div>
      )}
    </>
  );
}
 
/* Reusable per-registro editor. mode="add" creates a brand-new registro (the
   "llevas X/meta" hint and the goal shortcut account for today's existing
   total); mode="edit" edits one existing registro in place — its value simply
   replaces the old one, and the day's total is recalculated automatically. */
function RegistroForm({ habit, mode, initialValues, aggregate, onSave, onCancel }) {
  const buildBlank = () => {
    const v = {};
    habit.categories.forEach((c) => { v[c.type] = c.type === "booleano" ? false : ""; });
    return v;
  };
  const [values, setValues] = useState(initialValues || buildBlank());
  const [locked, setLocked] = useState(false);
 
  const applyGoal = (checked) => {
    setLocked(checked);
    if (checked) {
      const v = {};
      habit.categories.forEach((c) => {
        if (mode === "add" && ADDITIVE_TYPES.includes(c.type)) {
          const already = aggregate ? parseFloat(aggregate[c.type]) || 0 : 0;
          v[c.type] = Math.max(0, parseFloat(c.meta) - already);
        } else {
          v[c.type] = c.meta;
        }
      });
      setValues(v);
    }
  };
 
  return (
    <div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 16, alignItems: "flex-end" }}>
        {habit.categories.map((c) => (
          <CategoryEditor key={c.type} cat={c} value={values[c.type]} locked={locked}
            already={mode === "add" ? (aggregate ? aggregate[c.type] : 0) : null}
            onChange={(v) => setValues({ ...values, [c.type]: v })} />
        ))}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 12 }}>
        <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "var(--ink-soft)", cursor: "pointer" }}>
          <input type="checkbox" checked={locked} onChange={(e) => applyGoal(e.target.checked)} style={{ accentColor: "var(--teal)", width: 15, height: 15 }} />
          Cumplí la meta
        </label>
        <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
          {onCancel && <button onClick={onCancel} style={secondaryBtn}>Cancelar</button>}
          <button onClick={() => onSave(values)} style={{
            background: "var(--teal)", color: "#fff", border: "none", borderRadius: 999,
            padding: "9px 18px", fontSize: 13, fontWeight: 600, cursor: "pointer",
            display: "flex", alignItems: "center", gap: 6,
          }}>
            <Icon name="check" size={14} /> Guardar
          </button>
        </div>
      </div>
    </div>
  );
}
 
function CategoryEditor({ cat, value, locked, already, onChange }) {
  const def = CAT_BY_KEY[cat.type];
  const name = cat.label || def.label;
  const isAdditive = ADDITIVE_TYPES.includes(cat.type);
  const showHint = isAdditive && already !== null && already !== undefined;
  const soFar = parseFloat(already) || 0;
  return (
    <div>
      <div style={{ fontSize: 11, color: "var(--ink-soft)", marginBottom: 4, textTransform: "uppercase", letterSpacing: 0.4, display: "flex", alignItems: "center", gap: 4 }}>
        <span>{def.emoji}</span> {name} · meta {cat.type === "booleano" ? (cat.meta ? "Sí" : "No") : `${cat.meta}${cat.unit ? " " + cat.unit : ""}`}
      </div>
      {cat.type === "numero" && (
        <input type="number" disabled={locked} value={value} onChange={(e) => onChange(e.target.value)} placeholder="valor" style={inputSm} />
      )}
      {cat.type === "tiempo" && (
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <input type="number" disabled={locked} value={value} onChange={(e) => onChange(e.target.value)} placeholder="valor" style={{ ...inputSm, width: 70 }} />
          <span style={{ fontSize: 12, color: "var(--ink-soft)" }}>{cat.unit}</span>
        </div>
      )}
      {cat.type === "escala" && <Stars value={Number(value) || 0} onChange={onChange} disabled={locked} />}
      {cat.type === "valor" && (
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <input type="number" disabled={locked} value={value} onChange={(e) => onChange(e.target.value)} placeholder="valor" style={{ ...inputSm, width: 70 }} />
          <span style={{ fontSize: 12, color: "var(--ink-soft)" }}>{cat.unit}</span>
        </div>
      )}
      {cat.type === "booleano" && (
        <div style={{ display: "flex", border: "1px solid var(--line)", borderRadius: 8, overflow: "hidden", width: 110 }}>
          <button disabled={locked} onClick={() => onChange(true)} style={halfBtn(value === true)}>Sí</button>
          <button disabled={locked} onClick={() => onChange(false)} style={halfBtn(value === false)}>No</button>
        </div>
      )}
      {showHint && (
        <div style={{ fontSize: 10.5, color: "var(--ink-soft)", marginTop: 3 }}>
          llevas {soFar}/{cat.meta}{cat.unit ? " " + cat.unit : ""}
        </div>
      )}
    </div>
  );
}
const inputSm = {
  width: 70, padding: "6px 8px", borderRadius: 8, border: "1px solid var(--line)",
  background: "#fff", fontSize: 13, fontFamily: "var(--font-mono)", color: "var(--ink)",
};
function halfBtn(active) {
  return { flex: 1, padding: "6px 0", border: "none", cursor: "pointer", background: active ? "var(--teal)" : "#fff", color: active ? "#fff" : "var(--ink)", fontSize: 12.5, fontWeight: 600 };
}
 
/* ---------------------------------------------------------------------- */
/*  Tab 2 — Crear hábito                                                   */
/* ---------------------------------------------------------------------- */
 
function TabCrear({ onCreate, onUpdate, onDelete, onResetAll, habits }) {
  const [open, setOpen] = useState(false);
  const [editingHabitId, setEditingHabitId] = useState(null);
  const [name, setName] = useState("");
  const [icon, setIcon] = useState(null);
  const [cats, setCats] = useState([]);
  const [metas, setMetas] = useState({});
  const [freq, setFreq] = useState("Diario");
  const [days, setDays] = useState([]);
  const [ph, setPh] = useState(8); const [pm, setPm] = useState(0);
  const [error, setError] = useState("");
 
  const toggleCat = (key) => setCats((prev) => (prev.includes(key) ? prev.filter((c) => c !== key) : [...prev, key]));
  const setMeta = (key, patch) => setMetas((m) => ({ ...m, [key]: { ...m[key], ...patch } }));
  const toggleDay = (i) => setDays((prev) => (prev.includes(i) ? prev.filter((d) => d !== i) : [...prev, i]));
 
  const reset = () => {
    setEditingHabitId(null);
    setName(""); setIcon(null); setCats([]); setMetas({}); setFreq("Diario"); setDays([]);
    setPh(8); setPm(0); setError("");
  };
 
  const openEdit = (h) => {
    setEditingHabitId(h.id);
    setName(h.name);
    setIcon(h.icon || null);
    setCats(h.categories.map((c) => c.type));
    const m = {};
    h.categories.forEach((c) => {
      m[c.type] = { meta: c.type === "booleano" ? c.meta : String(c.meta), unit: c.unit, label: c.label };
    });
    setMetas(m);
    setFreq(h.frequency);
    setDays(h.days || []);
    const [hh, mm] = (h.schedule?.time || "08:00").split(":").map(Number);
    setPh(hh || 0); setPm(mm || 0);
    setError("");
    setOpen(true);
  };
 
  const submit = () => {
    if (!name.trim()) { setError("Escribe un nombre para el hábito."); return; }
    if (cats.length === 0) { setError("Selecciona al menos una categoría."); return; }
    for (const c of cats) {
      if (c !== "booleano" && (metas[c] == null || metas[c].meta === undefined || metas[c].meta === "")) {
        setError(`Define la meta para la categoría "${CAT_BY_KEY[c].label}".`);
        return;
      }
      if ((c === "tiempo" || c === "valor") && !metas[c].unit) {
        setError(`Define la unidad para la categoría "${CAT_BY_KEY[c].label}".`);
        return;
      }
    }
    const existing = habits.find((h) => h.id === editingHabitId);
    const habit = {
      id: editingHabitId || `h_${Date.now()}`,
      name: name.trim(),
      icon: icon || undefined,
      categories: cats.map((c) => {
        const m = metas[c] || {};
        const cat = { type: c };
        cat.meta = c === "booleano" ? (m.meta === false ? false : true) : parseFloat(m.meta);
        if (c === "tiempo") cat.unit = m.unit || "minutos";
        if (c === "valor") cat.unit = m.unit || "";
        if (c === "escala" && m.label) cat.label = m.label;
        return cat;
      }),
      frequency: freq,
      days: freq !== "Diario" ? days : [],
      schedule: { time: `${pad2(ph)}:${pad2(pm)}` },
      ...(existing?.isDefault ? { isDefault: true } : {}),
    };
    if (editingHabitId) onUpdate(habit); else onCreate(habit);
    reset();
    setOpen(false);
  };
 
  return (
    <div style={{ padding: "0 4px" }}>
      <h1 style={{ ...titleStyle, letterSpacing: 1.5, fontSize: 26 }}>Crear hábito</h1>
 
      {!open && (
        <div style={{ textAlign: "center" }}>
          <button onClick={() => setOpen(true)} style={primaryBtnBig}>
            <Icon name="plus" size={17} /> Nuevo hábito
          </button>
        </div>
      )}
 
      {open && (
        <div style={{ background: "var(--card)", border: "1px solid var(--line)", borderRadius: 16, padding: 18, marginTop: 16 }}>
          {editingHabitId && (
            <div style={{ fontSize: 12.5, fontWeight: 700, color: "var(--teal-ink)", marginBottom: 10 }}>Editando hábito</div>
          )}
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
            <div style={{ flex: "1 1 220px" }}>
              <FieldLabel>Nombre del hábito</FieldLabel>
              <input value={name} onChange={(e) => setName(e.target.value)} placeholder="p. ej. Dormir, Leer, Correr" style={{ ...inputSm, width: "100%" }} />
            </div>
            <div style={{ flex: "1 1 220px" }}>
              <FieldLabel>Categorías</FieldLabel>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {CATEGORY_DEFS.map((c) => {
                  const active = cats.includes(c.key);
                  return (
                    <button key={c.key} onClick={() => toggleCat(c.key)} style={{
                      display: "flex", alignItems: "center", gap: 5, padding: "7px 11px", borderRadius: 999,
                      border: active ? "1px solid var(--teal)" : "1px solid var(--line)",
                      background: active ? "var(--teal-soft)" : "#fff", color: active ? "var(--teal-ink)" : "var(--ink)",
                      fontSize: 12.5, cursor: "pointer", fontWeight: 500,
                    }}>
                      <span>{c.emoji}</span> {c.label}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
 
          <div style={{ marginTop: 14 }}>
            <FieldLabel>Símbolo</FieldLabel>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {HABIT_ICONS.map((opt) => {
                const active = icon === opt.key;
                return (
                  <button key={opt.key} onClick={() => setIcon(active ? null : opt.key)} title={opt.label} style={{
                    display: "flex", alignItems: "center", justifyContent: "center",
                    width: 34, height: 34, borderRadius: 10,
                    border: active ? "1px solid var(--teal)" : "1px solid var(--line)",
                    background: active ? "var(--teal-soft)" : "#fff", color: active ? "var(--teal-ink)" : "var(--ink-soft)",
                    cursor: "pointer",
                  }}>
                    <span style={{ fontSize: 16 }}>{opt.emoji}</span>
                  </button>
                );
              })}
            </div>
          </div>
 
          {cats.length > 0 && (
            <div style={{ marginTop: 16 }}>
              <FieldLabel>Meta y frecuencia</FieldLabel>
              <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "flex-end" }}>
                {cats.map((c) => (
                  <MetaEditor key={c} catKey={c} meta={metas[c]} onChange={(patch) => setMeta(c, patch)} />
                ))}
                <div>
                  <FieldSub>Frecuencia</FieldSub>
                  <select value={freq} onChange={(e) => setFreq(e.target.value)} style={{ ...inputSm, width: 130 }}>
                    {FREQS.map((f) => <option key={f} value={f}>{f}</option>)}
                  </select>
                </div>
              </div>
 
              {freq !== "Diario" && (
                <div style={{ marginTop: 12 }}>
                  <FieldSub>Días (opcional, para personalizar)</FieldSub>
                  <div style={{ display: "flex", gap: 5 }}>
                    {WEEKDAYS.map((w, i) => {
                      const active = days.includes(i);
                      return (
                        <button key={i} onClick={() => toggleDay(i)} style={{
                          width: 28, height: 28, borderRadius: "50%",
                          border: active ? "1px solid var(--teal)" : "1px solid var(--line)",
                          background: active ? "var(--teal)" : "#fff", color: active ? "#fff" : "var(--ink-soft)",
                          fontSize: 11.5, fontWeight: 700, cursor: "pointer",
                        }}>{w}</button>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}
 
          <div style={{ marginTop: 16 }}>
            <FieldLabel>Horario preferido</FieldLabel>
            <TimeCrown hh={ph} mm={pm} onChange={(h, m) => { setPh(h); setPm(m); }} />
          </div>
 
          {error && <p style={{ color: "var(--red)", fontSize: 12.5, marginTop: 12 }}>{error}</p>}
 
          <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
            <button onClick={submit} style={primaryBtnBig}>
              <Icon name="check" size={16} /> {editingHabitId ? "Guardar cambios" : "Guardar hábito"}
            </button>
            <button onClick={() => { reset(); setOpen(false); }} style={secondaryBtn}>Cancelar</button>
          </div>
        </div>
      )}
 
      <HabitsList habits={habits} onEdit={openEdit} onDelete={onDelete} />
 
      <div style={{ marginTop: 30, textAlign: "center" }}>
        <button
          onClick={() => { if (window.confirm("¿Borrar todos los hábitos y registros? Esta acción no se puede deshacer.")) onResetAll(); }}
          style={{ background: "none", border: "none", color: "var(--ink-soft)", fontSize: 11.5, cursor: "pointer", textDecoration: "underline" }}
        >
          Restablecer datos de la aplicación
        </button>
      </div>
    </div>
  );
}
 
function HabitsList({ habits, onEdit, onDelete }) {
  if (!habits.length) return null;
  return (
    <div style={{ marginTop: 26 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 6 }}>
        <div style={{ flex: 1, fontSize: 11, color: "var(--ink-soft)", textTransform: "uppercase", letterSpacing: 0.5, fontWeight: 600 }}>Hábito</div>
        <div style={{ width: 130, textAlign: "right", fontSize: 11, color: "var(--ink-soft)", textTransform: "uppercase", letterSpacing: 0.5, fontWeight: 600 }}>Meta</div>
        <div style={{ width: 40 }} />
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {habits.map((h) => (
          <div key={h.id} style={{
            display: "flex", alignItems: "flex-start", gap: 12,
            background: "var(--card)", border: "1px solid var(--line)", borderRadius: 12, padding: "10px 14px",
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0, flex: 1, paddingTop: 1 }}>
              <HabitIcon habit={h} size={12} />
              <span style={{ fontSize: 13.5, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{h.name}</span>
              {h.isDefault && (
                <span style={{ fontSize: 9.5, fontWeight: 700, color: "var(--blue-ink)", background: "var(--blue-soft)", borderRadius: 999, padding: "2px 7px", flex: "0 0 auto" }}>
                  fijo
                </span>
              )}
            </div>
            <div style={{ width: 130, textAlign: "right", display: "flex", flexDirection: "column", gap: 2 }}>
              {h.categories.map((c) => (
                <span key={c.type} style={{ fontSize: 11.5, color: "var(--ink-soft)", fontFamily: "var(--font-mono)" }}>{metaLine(c)}</span>

const FREQ_PERIODS = ["Semana", "Quincena", "Mes"];
 
/* The list of date-keys (oldest → newest, ending today) that the selected
   period covers. "Mes" is the current calendar month so far. */
function periodDayKeys(period, now) {
  const keys = [];
  if (period === "Mes") {
    for (let d = 1; d <= now.getDate(); d++) keys.push(`${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(d)}`);
    return keys;
  }
  const n = period === "Quincena" ? 15 : 7;
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    keys.push(dateKey(d));
  }
  return keys;
}
 
function dayColLabel(k, period) {
  const d = keyToDate(k);
  if (period === "Semana") return WEEKDAYS[mondayIndex(d)];
  return String(d.getDate());
}
 
function habitDoneOnDay(habit, entries, k) {
  const records = entries[`${habit.id}__${k}`];
  if (!records || !records.length) return null; // no data that day
  const aggregate = computeAggregate(habit.categories, records);
  return habit.categories.every((c) => meetsGoal(c, aggregate[c.type]));
}
 
/* General stats always consider the FULL set of habits — they describe
   overall performance, independent of which single habit is selected. */
function computeGeneralStats(allHabits, entries, days) {
  const expectedFor = (freq, n) => {
    if (freq === "Diario") return n;
    if (freq === "Semanal") return Math.max(1, Math.ceil(n / 7));
    if (freq === "Quincenal") return Math.max(1, Math.ceil(n / 15));
    return 1;
  };
 
  let completed = 0, expected = 0, logged = 0;
  allHabits.forEach((h) => {
    expected += expectedFor(h.frequency, days.length);
    days.forEach((k) => {
      const done = habitDoneOnDay(h, entries, k);
      if (done !== null) { logged += 1; if (done) completed += 1; }
    });
  });
  const completionRate = expected > 0 ? Math.min(100, Math.round((completed / expected) * 100)) : 0;
  const consistency = (allHabits.length * days.length) > 0 ? Math.round((logged / (allHabits.length * days.length)) * 100) : 0;
 
  const rate = (subset) => {
    let c = 0, e = 0;
    allHabits.forEach((h) => subset.forEach((k) => {
      e += 1;
      const done = habitDoneOnDay(h, entries, k);
      if (done) c += 1;
    }));
    return e > 0 ? c / e : 0;
  };
  const mid = Math.floor(days.length / 2);
  const earlier = days.slice(0, mid);
  const later = days.slice(days.length - mid);
  let trend = "estable";
  if (mid > 0) {
    const diff = rate(later) - rate(earlier);
    if (diff > 0.05) trend = "sube";
    else if (diff < -0.05) trend = "baja";
  }
 
  const counts = {};
  allHabits.forEach((h) => { counts[h.frequency] = (counts[h.frequency] || 0) + 1; });
  const freqLabel = Object.entries(counts).map(([f, n]) => `${n} ${f.toLowerCase()}`).join(", ") || "—";
 
  return { completionRate, consistency, trend, freqLabel };
}
 
/* Specific stats are computed per single habit over the selected period. */
function computeSpecificStats(habit, entries, days) {
  const savedMinutes = [];
  const doneFlags = days.map((k) => {
    const records = entries[`${habit.id}__${k}`];
    if (records && records.length) records.forEach((r) => { if (r.savedAt) savedMinutes.push(timeToMinutes(r.savedAt)); });
    return habitDoneOnDay(habit, entries, k) === true;
  });
 
  let streak = 0;
  for (let i = doneFlags.length - 1; i >= 0; i--) { if (doneFlags[i]) streak += 1; else break; }
  const missed = doneFlags.filter((d) => !d).length;
 
  let stdDevLabel = "—";
  if (savedMinutes.length >= 2) {
    const mean = savedMinutes.reduce((a, b) => a + b, 0) / savedMinutes.length;
    const variance = savedMinutes.reduce((a, b) => a + (b - mean) ** 2, 0) / savedMinutes.length;
    const sd = Math.sqrt(variance);
    stdDevLabel = sd < 60 ? `${Math.round(sd)} min` : `${(sd / 60).toFixed(1)} h`;
  }
 
  return { streak, missed, stdDevLabel };
}

/* A tiny hand-rolled scatter plot (no chart library needed) for the sleep chart. */
function SleepScatter({ data, xMax }) {
  const width = 300, height = 150, padL = 22, padB = 6, padT = 6, padR = 6;
  const plotW = width - padL - padR, plotH = height - padT - padB;
  const yMax = 12;
  const xScale = (d) => padL + ((d - 1) / (xMax - 1 || 1)) * plotW;
  const yScale = (h) => padT + plotH - (Math.min(h, yMax) / yMax) * plotH;
  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height: 190 }}>
      {[0, 3, 6, 9, 12].map((t) => (
        <g key={t}>
          <line x1={padL} x2={width - padR} y1={yScale(t)} y2={yScale(t)} stroke="var(--line)" strokeDasharray="2 2" strokeWidth={0.6} />
          <text x={padL - 4} y={yScale(t) + 2.5} fontSize="6.5" textAnchor="end" fill="var(--ink-soft)">{t}</text>
        </g>
      ))}
      {data.map((d, i) => (
        <circle key={i} cx={xScale(d.day)} cy={yScale(d.hours)} r={2.6} fill="var(--blue)">
          <title>{`día ${d.day}: ${d.hours} h`}</title>
        </circle>
      ))}
    </svg>
  );
}
 
function TabSeguimiento({ habits, entries }) {
  const [selectedId, setSelectedId] = useState(null);
  const [period, setPeriod] = useState("Mes");
 
  const selectedHabit = habits.find((h) => h.id === selectedId) || null;
  const now = new Date();
  const days = useMemo(() => periodDayKeys(period, now), [period]);
 
  const heatmapHabits = selectedHabit ? [selectedHabit] : habits;
  const general = useMemo(() => computeGeneralStats(habits, entries, days), [habits, entries, days]);
  const specific = useMemo(() => (selectedHabit ? computeSpecificStats(selectedHabit, entries, days) : null), [selectedHabit, entries, days]);
  const specificAll = useMemo(() => (!selectedHabit ? habits.map((h) => ({ habit: h, ...computeSpecificStats(h, entries, days) })) : []), [selectedHabit, habits, entries, days]);
 
  const sleepHabit = useMemo(() => {
    const flagged = habits.find((h) => h.isDefault);
    if (flagged && flagged.categories.some((c) => c.type === "tiempo")) return flagged;
    return habits.find((h) => /sue.o|dorm/i.test(h.name) && h.categories.some((c) => c.type === "tiempo")) || null;
  }, [habits]);
 
  const chartData = useMemo(() => {
    if (!sleepHabit) return [];
    const year = now.getFullYear(), month = now.getMonth();
    const tiempoCat = sleepHabit.categories.find((c) => c.type === "tiempo");
    const data = [];
    for (let d = 1; d <= now.getDate(); d++) {
      const k = `${year}-${pad2(month + 1)}-${pad2(d)}`;
      const records = entries[`${sleepHabit.id}__${k}`];
      if (records && records.length) {
        const aggregate = computeAggregate(sleepHabit.categories, records);
        let hours = parseFloat(aggregate.tiempo) || 0;
        if (tiempoCat.unit === "minutos") hours = hours / 60;
        data.push({ day: d, hours: Math.round(hours * 10) / 10 });
      }
    }
    return data;
  }, [sleepHabit, entries]);
 
  const habitOptions = [{ value: null, label: "General (todos)" }, ...habits.map((h) => ({ value: h.id, label: h.name }))];
  const periodOptions = FREQ_PERIODS.map((p) => ({ value: p, label: p }));
 
  return (
    <div style={{ padding: "0 4px" }}>
      <h1 style={{ ...titleStyle, letterSpacing: 1.5, fontSize: 26 }}>Seguimiento</h1>
 
      <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
        <SimpleDropdown options={habitOptions} value={selectedId} onChange={setSelectedId} />
        <SimpleDropdown options={periodOptions} value={period} onChange={setPeriod} />
      </div>
 
      <div style={{ background: "var(--card)", border: "1px solid var(--line)", borderRadius: 16, padding: "16px 18px", marginBottom: 20 }}>
        <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 0.5, color: "var(--ink-soft)", fontWeight: 600, marginBottom: 8 }}>
          Horas de sueño — {MONTHS[now.getMonth()]}
        </div>
        {sleepHabit ? (
          <div style={{ width: "100%", height: 190 }}>
            <SleepScatter data={chartData} xMax={daysInMonth(now.getFullYear(), now.getMonth())} />
          </div>
        ) : (
          <p style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>
            Crea un hábito de tiempo llamado "Dormir" o "Sueño" para ver aquí tu gráfico de horas.
          </p>
        )}
      </div>
 
      <HabitHeatmap habitList={heatmapHabits} entries={entries} days={days} period={period} />
 
      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 0.5, color: "var(--ink-soft)", fontWeight: 700, marginBottom: 8 }}>
        Estadísticas generales
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 12, marginBottom: 22 }}>
        <StatCard label="Tasa de cumplimiento" value={`${general.completionRate}%`} />
        <StatCard label="Consistencia" value={`${general.consistency}%`} />
        <StatCard label="Frecuencia" value={general.freqLabel} small />
        <StatCard label="Tendencia" value={
          <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
            {general.trend === "sube" && <Icon name="trending-up" size={16} color="var(--teal)" />}
            {general.trend === "baja" && <Icon name="trending-down" size={16} color="var(--red)" />}
            {general.trend === "estable" && <Icon name="minus" size={16} color="var(--ink-soft)" />}
            {general.trend}
          </span>
        } />
      </div>
 
      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 0.5, color: "var(--ink-soft)", fontWeight: 700, marginBottom: 8 }}>
        {selectedHabit ? `Estadísticas de "${selectedHabit.name}"` : "Estadísticas por hábito"}
      </div>
 
      {selectedHabit ? (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 12 }}>
          <StatCard label="Racha actual" value={`${specific.streak} día${specific.streak === 1 ? "" : "s"}`} />
          <StatCard label="Días perdidos" value={specific.missed} />
          <StatCard label="Desv. estándar (horario)" value={specific.stdDevLabel} small />
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <div style={{ display: "grid", gridTemplateColumns: "1.4fr 0.8fr 0.8fr 1fr", gap: 8, padding: "0 10px" }}>
            {["Hábito", "Racha", "Perdidos", "Desv. horario"].map((h) => (
              <div key={h} style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: 0.4, color: "var(--ink-soft)", fontWeight: 700 }}>{h}</div>
            ))}
          </div>
          {specificAll.map(({ habit, streak, missed, stdDevLabel }) => (
            <div key={habit.id} style={{
              display: "grid", gridTemplateColumns: "1.4fr 0.8fr 0.8fr 1fr", gap: 8, alignItems: "center",
              background: "var(--card)", border: "1px solid var(--line)", borderRadius: 10, padding: "9px 10px", fontSize: 12.5,
            }}>
              <span style={{ fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{habit.name}</span>
              <span style={{ fontFamily: "var(--font-mono)" }}>{streak}d</span>
              <span style={{ fontFamily: "var(--font-mono)" }}>{missed}</span>
              <span style={{ fontFamily: "var(--font-mono)" }}>{stdDevLabel}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function App() {

  useEffect(() => {

      const [h, rawEntries, r] = await Promise.all([
        storageGet("habits", []),
        storageGet("entries", {}),
        storageGet("rows", []),
      ]);
 
      // Migrate legacy single-object entries (pre multi-registro model) into arrays.
      const e = {};
      Object.entries(rawEntries).forEach(([k, v]) => {
        e[k] = Array.isArray(v) ? v : [{ id: "legacy", values: v.values, savedAt: v.savedAt }];

      let seeded = h;
      if (!h.some((x) => x.isDefault)) {
        // Prefer linking to whichever existing sleep-like habit already has the
        // person's data, rather than a strict exact-name match (which is what
        // caused the chart to silently point at an empty duplicate before).
        const existingSleep = h.find((x) => /sue.o|dorm/i.test(x.name) && x.categories.some((c) => c.type === "tiempo"));
        seeded = existingSleep
          ? h.map((x) => (x.id === existingSleep.id ? { ...x, isDefault: true, icon: x.icon || "moon" } : x))
          : [DEFAULT_SLEEP_HABIT, ...h];
      } else {
        // Repair: an earlier session may have flagged the generic empty seed
        // instead of the person's real, data-filled sleep habit. If the flagged
        // habit is that empty seed and has no registros, re-point the flag.
        const flagged = h.find((x) => x.isDefault);
        const flaggedHasData = Object.keys(e).some((k) => k.startsWith(`${flagged.id}__`));
        if (flagged.id === "default_sleep" && !flaggedHasData) {
          const betterMatch = h.find((x) => !x.isDefault && /sue.o|dorm/i.test(x.name) && x.categories.some((c) => c.type === "tiempo"));
          if (betterMatch) {
            seeded = h.filter((x) => x.id !== "default_sleep").map((x) => (x.id === betterMatch.id ? { ...x, isDefault: true, icon: x.icon || "moon" } : x));
          }
        }
      }
 
      setHabits(seeded); setEntries(e); setRows(r);
      setReady(true);
    })();
  }, []);
 
  useEffect(() => { if (ready) storageSet("habits", habits); }, [habits, ready]);
  useEffect(() => { if (ready) storageSet("entries", entries); }, [entries, ready]);
  useEffect(() => { if (ready) storageSet("rows", rows); }, [rows, ready]);
 
  const addHabit = (habit) => { setHabits((prev) => [...prev, habit]); setTab(1); };
  const updateHabit = (habit) => { setHabits((prev) => prev.map((h) => (h.id === habit.id ? habit : h))); };
  const deleteHabit = (id) => {
    setHabits((prev) => {
      const target = prev.find((h) => h.id === id);
      if (!target || target.isDefault) return prev; // protected habit — never removable
      return prev.filter((h) => h.id !== id);
    });
    setRows((prev) => prev.filter((r) => r.habitId !== id));
  };
 
  // Wipes every habit, registro and row back to a clean slate — just the
  // protected "Dormir" habit remains, ready for real use.
  const resetAll = () => {
    storageClearAll();
    setHabits([DEFAULT_SLEEP_HABIT]);
    setEntries({});
    setRows([]);
    setTab(1);
  };
 
  // Adds a brand-new registro for (habitId, date). It never overwrites — it
  // appends to that day's list, and the day's total is the sum of everything
  // in it. Also makes sure a group card exists in `rows` to show it.
  const commitEntry = (habitId, date, values) => {
    const key = `${habitId}__${date}`;
    const record = { id: `r_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`, values, savedAt: `${pad2(new Date().getHours())}:${pad2(new Date().getMinutes())}` };
    setEntries((prev) => ({ ...prev, [key]: [...(prev[key] || []), record] }));
    setRows((prev) => {
      const exists = prev.some((r) => r.habitId === habitId && r.date === date);
      return exists ? prev : [...prev, { rowId: `${habitId}-${date}`, habitId, date }];
    });
  };
 
  // Edits one specific registro in place — only that record changes; the
  // day's total recalculates automatically since it's derived from the sum.
  const editRecord = (habitId, date, recordId, values) => {
    const key = `${habitId}__${date}`;
    setEntries((prev) => ({
      ...prev,
      [key]: (prev[key] || []).map((r) => (r.id === recordId ? { ...r, values } : r)),
    }));
  };
 
  const removeRecord = (habitId, date, recordId) => {
    setEntries((prev) => {
      const key = `${habitId}__${date}`;
      const list = (prev[key] || []).filter((r) => r.id !== recordId);
      return { ...prev, [key]: list };
    });
  };
 
  if (!ready) {
    return <div style={{ padding: 40, textAlign: "center", color: "var(--ink-soft)" }}>Cargando…</div>;
  }
 
  return (
    <div style={{
      fontFamily: "var(--font-sans)", background: "var(--paper)", color: "var(--ink)",
      borderRadius: 20, padding: "22px 18px 90px", maxWidth: 640, margin: "0 auto", position: "relative", minHeight: 560,
    }}>
      <style>{`
        :root {
          --paper: #EDEAE1; --card: #F8F6EF; --ink: #23281F; --ink-soft: #6B7066;
          --line: #DAD5C7; --teal: #145C3C; --teal-soft: #DCEAE1; --teal-ink: #123524;
          --blue: #2761E8; --blue-soft: #DDE7FB; --blue-ink: #1B3F9E;
          --amber: #C98A3B; --amber-soft: #F3E3CB; --amber-ink: #8A5A20; --red: #B24632;
          --font-sans: 'IBM Plex Sans', sans-serif; --font-mono: 'IBM Plex Mono', monospace;
        }
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
        * { box-sizing: border-box; }
        input, select { font-family: var(--font-sans); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { scrollbar-width: none; }
        button { font-family: var(--font-sans); }
      `}</style>
 
      {tab === 1 && <TabRegistro habits={habits} entries={entries} commitEntry={commitEntry} editRecord={editRecord} removeRecord={removeRecord} rows={rows} goToCreate={() => setTab(2)} />}
      {tab === 2 && <TabCrear onCreate={addHabit} onUpdate={updateHabit} onDelete={deleteHabit} onResetAll={resetAll} habits={habits} />}
      {tab === 3 && <TabSeguimiento habits={habits} entries={entries} />}
 
      <div style={{
        position: "absolute", bottom: 16, left: 18, right: 18, display: "flex",
        background: "var(--card)", border: "1px solid var(--line)", borderRadius: 999, padding: 5, gap: 4,
      }}>
        <NavBtn active={tab === 1} onClick={() => setTab(1)} emoji="📝" label="Hábito" />
        <NavBtn active={tab === 2} onClick={() => setTab(2)} emoji="➕" label="Crear" />
        <NavBtn active={tab === 3} onClick={() => setTab(3)} emoji="📊" label="Seguimiento" />
      </div>
    </div>
  );
}
 
function NavBtn({ active, onClick, emoji, label }) {
  return (
    <button onClick={onClick} style={{
      flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
      padding: "10px 0", borderRadius: 999, border: "none", cursor: "pointer",
      background: active ? "var(--teal)" : "transparent", color: active ? "#fff" : "var(--ink-soft)",
      fontSize: 12.5, fontWeight: 600, transition: "background 0.15s ease",
    }}>
      <span style={{ fontSize: 15 }}>{emoji}</span> {label}
    </button>
  );
}
 
createRoot(document.getElementById("root")).render(<App />);
 
</script>
 
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
